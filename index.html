<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Δίχτυ ασφαλείας: αν το GitHub Pages είναι ρυθμισμένο στον φάκελο «/ (root)» αντί για «/docs»,
    αυτή η σελίδα στέλνει τον επισκέπτη στη φόρμα (docs/). Με ρύθμιση «/docs» δεν χρησιμοποιείται.
  -->
  <meta http-equiv="refresh" content="0; url=docs/">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="canonical" href="docs/">
  <title>Ερωτηματολόγιο</title>
</head>
<body>
  <p>Μεταφορά στο ερωτηματολόγιο… Αν δεν γίνει αυτόματα, <a href="docs/">πατήστε εδώ</a>.</p>
</body>
</html>
